AWSTemplateFormatVersion: "2010-09-09"

Resources:
  CfnSampleCloudwatchCompositealarm:
    Type: AWS::CloudWatch::CompositeAlarm
    Properties:
      ActionsEnabled: false
      ActionsSuppressor: ""
      ActionsSuppressorExtensionPeriod: 0
      ActionsSuppressorWaitPeriod: 0
      AlarmActions: []
      AlarmDescription: ""
      AlarmName: ""
      AlarmRule: ""
      InsufficientDataActions: []
      OKActions: []
      ActionConfiguration:
        AlarmTagsPropagation:
          Enabled: false
          ExcludedTagKeys: []
          IncludedTagKeys: []
      Tags:
        - Key: ""
          Value: ""
