      AnalyticsEngine: ""
      AutoApprovedChangeTypes: []
      CreatorDisplayName: ""
      CreatorMemberAbilities: []
      Description: ""
      IsMetricsEnabled: false
      JobLogStatus: ""
      Name: ""
      QueryLogStatus: ""
      CreatorMLMemberAbilities:
        CustomMLMemberAbilities: []
      CreatorPaymentConfiguration:
