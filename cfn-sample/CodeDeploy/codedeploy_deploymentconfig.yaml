AWSTemplateFormatVersion: "2010-09-09"

Resources:
  CfnSampleCodedeployDeploymentconfig:
    Type: AWS::CodeDeploy::DeploymentConfig
    Properties:
      ComputePlatform: ""
      DeploymentConfigName: ""
      MinimumHealthyHosts:
        Type: ""
        Value: 0
      TrafficRoutingConfig:
        Type: ""
        TimeBasedCanary:
          CanaryInterval: 0
          CanaryPercentage: 0
        TimeBasedLinear:
          LinearInterval: 0
          LinearPercentage: 0
      ZonalConfig:
        FirstZoneMonitorDurationInSeconds: 0
        MonitorDurationInSeconds: 0
        MinimumHealthyHostsPerZone:
          Type: ""
          Value: 0
